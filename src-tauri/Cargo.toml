[package]
name = "abaf"
version = "0.1.0"
description = "ABAF – Système de gestion Activité Coton Graine"
authors = ["ABAF SARL"]
edition = "2021"

[lib]
name = "abaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-shell  = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite   = { version = "0.32", features = ["bundled", "backup"] }
rust_xlsxwriter = "0.81"

chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "2"
anyhow     = "1"
uuid       = { version = "1", features = ["v4"] }

# ─── Synchronisation avec les applications de terrain ────────────────────────
# Serveur HTTP local (poste = serveur, téléphone = client) + découverte du poste
# sur le réseau WiFi partagé.
axum              = { version = "0.8", features = ["http1", "json", "query", "tokio", "macros"] }
tokio             = { version = "1", features = ["net", "rt", "time", "io-util", "sync", "macros"] }
sha2              = "0.10"
rand              = "0.8"
base64            = "0.22"
local-ip-address  = "0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true
